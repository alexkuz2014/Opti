name: Dev-сборка

# Ручной запуск: собирает Opti.exe и Opti.Dev.exe (рядом с ним ведётся dev.zip с диагностикой) и кладёт их в артефакты запуска.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Тесты
        run: dotnet test -c Release --nologo
      - name: Сборка
        shell: pwsh
        env:
          DEV: '1'
        run: ./build/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: opti-dev
          path: |
            artifacts/Opti.exe
            artifacts/Opti.Dev.exe
            artifacts/opti-cli.exe
            artifacts/SHA256SUMS.txt
