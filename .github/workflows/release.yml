name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Тесты
        run: dotnet test -c Release --nologo
      - name: PresentMon (MIT) для режима «Игра через PresentMon»
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory tools -Force | Out-Null
          gh release download -R GameTechDev/PresentMon --pattern "PresentMon-*-x64.exe" -D tools
          Get-ChildItem tools\PresentMon-*-x64.exe | Select-Object -First 1 | Rename-Item -NewName PresentMon.exe
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Сборка релиза
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d') { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          ./build/publish.ps1 -Version $v
      - name: Описание релиза
        shell: pwsh
        run: |
          $notes = "docs/release-notes/${{ github.ref_name }}.md"
          if (Test-Path $notes) { Copy-Item $notes release-notes.md } else { Copy-Item CHANGELOG.md release-notes.md }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: GameTune ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
